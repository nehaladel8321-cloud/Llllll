<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🌿 LoLo's Wellness Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-0: #f5f2ec; --bg-1: #ede8e0; --bg-2: #e8e4dc;
            --card: #ffffff; --card-2: #faf7f2; --border: #d8d0c4;
            --text: #2e2a24; --muted: #8a7f70;
            --sage: #7d9a7a; --terracotta: #c17a5c; --sand: #d4b896;
            --plum: #7a5a7a; --dusty-rose: #c48a8a; --olive: #8a8a5a;
            --gold: #b8963e; --charcoal: #3a3630; --cream: #f5f0e8;
            --accent: #c17a5c; --accent-soft: #e8d0c0;
            --kid1: #c48a8a; --kid2: #7d9a7a; --kid3: #8a8a5a; --mom: #7a5a7a;
        }
        html, body {
            background: linear-gradient(135deg, #f5f2ec 0%, #ede8e0 40%, #e8e4dc 100%);
            background-attachment: fixed; min-height: 100vh; color: var(--text);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased; padding: 20px 16px 50px;
            display: flex; flex-direction: column; align-items: center;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background:
                radial-gradient(circle at 15% 20%, rgba(193,122,92,0.08) 0%, transparent 35%),
                radial-gradient(circle at 85% 75%, rgba(125,154,122,0.08) 0%, transparent 35%),
                radial-gradient(circle at 50% 50%, rgba(122,90,122,0.05) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }

        .app-header { position: relative; z-index: 1; width: 100%; max-width: 1100px; margin-bottom: 20px; text-align: center; }
        h1 {
            font-family: 'Cormorant Garamond', serif; font-size: 2.6rem; font-weight: 700;
            letter-spacing: 0.01em;
            background: linear-gradient(135deg, var(--terracotta) 0%, var(--plum) 50%, var(--sage) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 6px;
        }
        .subhead {
            font-size: 0.78rem; font-weight: 500; color: var(--muted);
            letter-spacing: 0.12em; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .subhead .dot {
            width: 4px; height: 4px; border-radius: 50%; background: var(--sage);
            display: inline-block;
        }

        .page-nav {
            position: relative; z-index: 1;
            display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
            margin-bottom: 24px; width: 100%; max-width: 1100px;
        }
        .nav-btn {
            background: var(--card); border: 1.5px solid var(--border); border-radius: 8px;
            padding: 9px 15px; font-size: 0.78rem; font-weight: 500;
            font-family: 'Outfit', sans-serif; color: var(--text); cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center; gap: 6px;
            letter-spacing: 0.02em;
        }
        .nav-btn:hover { border-color: var(--terracotta); background: #faf6f2; }
        .nav-btn.active {
            background: var(--terracotta);
            border-color: var(--terracotta); color: #fff;
        }
        .nav-btn.bank-btn { border-color: #c4d4c0; color: #5a7a58; }
        .nav-btn.bank-btn.active { background: var(--sage); border-color: var(--sage); color: #fff; }
        .nav-btn.rewards-btn { border-color: #d4c8a8; color: #8a6a2a; }
        .nav-btn.rewards-btn.active { background: var(--gold); border-color: var(--gold); color: #fff; }

        .page-content { position: relative; z-index: 1; width: 100%; max-width: 1100px; }

        .day-title {
            font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 600;
            text-align: center; letter-spacing: 0.01em; margin-bottom: 6px;
            color: var(--charcoal);
        }
        .day-progress {
            text-align: center; font-size: 0.75rem; font-weight: 500;
            color: var(--muted); margin-bottom: 22px;
            text-transform: uppercase; letter-spacing: 0.12em;
        }
        .day-progress.complete { color: var(--sage); }

        .subject-block {
            background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
            padding: 18px; margin-bottom: 14px; transition: all 0.2s;
            border-left-width: 4px;
        }
        .subject-block:hover { border-color: var(--sand); }
        .subject-block.kid1 { border-left-color: var(--kid1); }
        .subject-block.kid2 { border-left-color: var(--kid2); }
        .subject-block.kid3 { border-left-color: var(--kid3); }
        .subject-block.mom  { border-left-color: var(--mom); }

        .subject-header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; cursor: pointer; user-select: none;
            padding-bottom: 0; margin-bottom: 0;
            transition: all 0.15s ease;
        }
        .subject-block.expanded .subject-header {
            padding-bottom: 12px; margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }
        .subject-name-display {
            font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; font-weight: 600;
            color: var(--charcoal); flex: 1;
            display: flex; align-items: center; gap: 8px;
        }
        .subject-chevron {
            font-size: 0.75rem; color: var(--terracotta); transition: transform 0.25s ease;
            display: inline-block;
        }
        .subject-block.expanded .subject-chevron { transform: rotate(90deg); }
        .subject-task-count {
            font-size: 0.7rem; font-weight: 500; color: var(--muted);
            background: var(--card-2); padding: 3px 9px; border-radius: 6px;
            border: 1px solid var(--border);
        }
        .subject-body { display: none; }
        .subject-block.expanded .subject-body { display: block; animation: slideDown 0.22s ease; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: none; }
        }

        .btn-icon {
            background: transparent; border: 1.5px solid var(--border); border-radius: 6px;
            width: 30px; height: 30px; font-size: 0.85rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); transition: all 0.15s ease;
            font-family: inherit; flex-shrink: 0;
        }
        .btn-icon:hover { background: var(--dusty-rose); color: #fff; border-color: var(--dusty-rose); }

        .btn-add-task {
            background: transparent; border: 1.5px dashed var(--sage); border-radius: 8px;
            padding: 9px 16px; font-size: 0.8rem; font-weight: 500; color: var(--sage);
            cursor: pointer; margin-top: 12px; display: inline-flex; align-items: center; gap: 6px;
            font-family: inherit; transition: all 0.15s ease;
        }
        .btn-add-task:hover { background: #f0f5ee; }
        .btn-add-task:disabled { opacity: 0.35; cursor: not-allowed; border-style: solid; }

        .btn-add-subject {
            background: transparent;
            border: 1.5px dashed var(--terracotta); border-radius: 14px; padding: 20px;
            font-size: 0.92rem; font-weight: 500; color: var(--terracotta); cursor: pointer;
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: 'Outfit', sans-serif; transition: all 0.2s ease;
            margin-top: 8px; letter-spacing: 0.03em;
        }
        .btn-add-subject:hover { background: #faf4ee; border-style: solid; }

        .task-list { display: flex; flex-direction: column; gap: 10px; }
        .task-item {
            display: flex; flex-direction: column; gap: 8px;
            background: var(--card-2); border-radius: 10px;
            padding: 12px 14px; border: 1px solid var(--border);
            transition: all 0.15s ease;
        }
        .task-item:hover { border-color: var(--sand); }
        .task-item.done { background: #f4f8f2; border-color: #c4d4c0; opacity: 0.85; }

        .task-main-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .task-text-display {
            flex: 1; font-size: 0.9rem; font-weight: 500;
            color: var(--text); min-width: 0; word-break: break-word;
        }
        .task-item.done .task-text-display { color: var(--muted); text-decoration: line-through; }

        .task-check {
            background: #fff; border: 1.5px solid var(--sand); border-radius: 50%;
            width: 24px; height: 24px; font-size: 0.8rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); transition: all 0.15s ease;
            flex-shrink: 0; padding: 0; line-height: 1; font-family: inherit;
        }
        .task-check:hover { border-color: var(--sage); background: #f0f5ee; }
        .task-check.done { background: var(--sage); border-color: var(--sage); color: #fff; }

        .task-remove {
            background: transparent; border: none; color: var(--muted);
            font-size: 0.95rem; cursor: pointer; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 5px; flex-shrink: 0; padding: 0; line-height: 1; font-family: inherit;
            transition: all 0.15s ease;
        }
        .task-remove:hover { background: #f8e8e8; color: var(--dusty-rose); }

        /* ---- TIME RANGE STYLES ---- */
        .task-time-row {
            display: flex; align-items: center; gap: 8px;
            padding-left: 34px; flex-wrap: wrap;
        }
        .time-label {
            font-size: 0.72rem; font-weight: 500; color: var(--muted);
            letter-spacing: 0.03em;
        }
        .time-input {
            font-family: 'Outfit', sans-serif; font-size: 0.82rem; font-weight: 500;
            color: var(--text); background: #fff; border: 1px solid var(--border);
            border-radius: 6px; padding: 4px 8px; width: 92px;
            transition: border-color 0.15s;
        }
        .time-input:focus { outline: none; border-color: var(--terracotta); }
        .time-sep { font-size: 0.75rem; color: var(--muted); }

        .task-extras { display: flex; flex-direction: column; gap: 6px; padding-left: 34px; }
        .extras-toggle {
            display: inline-flex; align-items: center; gap: 5px;
            background: transparent; border: 1px solid var(--border); border-radius: 6px;
            padding: 4px 10px; font-size: 0.72rem; font-weight: 500;
            color: var(--muted); cursor: pointer; font-family: inherit;
            align-self: flex-start; transition: all 0.15s ease;
        }
        .extras-toggle:hover { border-color: var(--sand); color: var(--text); }
        .extras-toggle .badge {
            background: var(--sand); color: var(--charcoal); border-radius: 4px;
            padding: 1px 6px; font-size: 0.65rem; font-weight: 600;
        }
        .extras-panel {
            display: flex; flex-direction: column; gap: 6px;
            background: #faf8f4; border: 1px solid var(--border);
            border-radius: 8px; padding: 8px; margin-top: 2px;
        }

        .link-item, .note-item {
            display: flex; align-items: center; gap: 6px;
            background: #fff; border: 1px solid var(--border);
            border-radius: 7px; padding: 6px 8px;
        }
        .note-item { align-items: flex-start; }

        .link-icon { font-size: 0.8rem; flex-shrink: 0; padding-top: 2px; }
        .link-input {
            flex: 1; border: none; background: transparent;
            font-size: 0.8rem; font-family: inherit;
            color: var(--terracotta); min-width: 0;
            padding: 2px 0;
        }
        .link-input:focus { outline: none; }
        .link-input::placeholder { color: #b8a898; }
        .link-open {
            font-size: 0.7rem; background: var(--sand); color: var(--charcoal);
            border: none; border-radius: 5px; padding: 3px 8px;
            font-weight: 600; cursor: pointer; font-family: inherit;
            flex-shrink: 0; text-decoration: none;
        }
        .link-open:hover { background: var(--terracotta); color: #fff; }

        .note-textarea {
            flex: 1; border: none; background: transparent;
            font-size: 0.8rem; font-family: inherit;
            color: var(--text); min-width: 0; resize: vertical;
            min-height: 24px; padding: 2px 0; line-height: 1.4;
            max-height: 180px; overflow: hidden;
        }
        .note-textarea:focus { outline: none; }
        .note-textarea::placeholder { color: #b8a898; }

        .remove-mini {
            background: transparent; border: none; color: var(--muted);
            font-size: 0.8rem; cursor: pointer; width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px; flex-shrink: 0; padding: 0; line-height: 1; font-family: inherit;
        }
        .remove-mini:hover { background: #f8e8e8; color: var(--dusty-rose); }

        .extras-add-row { display: flex; gap: 6px; margin-top: 2px; }
        .extras-add-btn {
            flex: 1; background: #fff; border: 1px dashed var(--border);
            border-radius: 6px; padding: 6px 8px;
            font-size: 0.7rem; font-weight: 500;
            color: var(--muted); cursor: pointer; font-family: inherit;
            transition: all 0.15s ease;
        }
        .extras-add-btn:hover { border-color: var(--sand); color: var(--text); }

        .empty-hint {
            font-size: 0.82rem; color: var(--muted); font-style: italic;
            padding: 18px 12px; text-align: center;
            border: 1px dashed var(--border); border-radius: 10px;
            margin-bottom: 4px; background: var(--card-2);
        }

        /* BANK PAGE */
        .bank-title {
            font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 600;
            text-align: center; margin-bottom: 6px;
            color: var(--sage);
        }
        .bank-sub { text-align: center; font-size: 0.8rem; color: var(--muted);
            margin-bottom: 20px; letter-spacing: 0.04em; }

        .btn-add-bank-subject {
            background: transparent;
            border: 1.5px dashed var(--sage); border-radius: 12px;
            padding: 16px; font-size: 0.88rem; font-weight: 500; color: var(--sage);
            cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: 'Outfit', sans-serif; transition: all 0.2s ease;
            margin-bottom: 18px; letter-spacing: 0.03em;
        }
        .btn-add-bank-subject:hover { background: #f0f5ee; border-style: solid; }

        .bank-subject-card {
            background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
            padding: 18px; margin-bottom: 14px;
        }
        .bank-subject-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 14px; padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .bank-subject-name-input {
            font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 600;
            color: var(--charcoal); background: transparent;
            border: 1px solid transparent; border-radius: 6px;
            padding: 5px 8px; flex: 1; min-width: 100px; transition: 0.15s;
        }
        .bank-subject-name-input:hover { border-color: var(--border); }
        .bank-subject-name-input:focus { outline: none; border-color: var(--terracotta); background: #faf6f2; }

        .bank-item {
            display: flex; flex-direction: column; gap: 6px;
            background: var(--card-2); border-radius: 10px;
            padding: 10px 12px; margin-bottom: 8px;
            border: 1px solid var(--border); transition: all 0.15s;
        }
        .bank-item:hover { border-color: var(--sand); }
        .bank-main-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .bank-task-input {
            flex: 1; font-size: 0.88rem; font-weight: 500; color: var(--text);
            background: transparent; border: none;
            border-bottom: 1px solid transparent; padding: 3px 2px;
            font-family: inherit; min-width: 0;
        }
        .bank-task-input:focus { outline: none; border-bottom-color: var(--terracotta); }

        .bank-add-row {
            display: flex; gap: 8px; margin-top: 10px;
            background: var(--card-2); border: 1px solid var(--border);
            border-radius: 10px; padding: 8px;
        }
        .bank-add-row input {
            flex: 1; background: transparent; border: none; color: var(--text);
            font-size: 0.86rem; font-family: inherit; padding: 6px 8px;
        }
        .bank-add-row input:focus { outline: none; }
        .bank-add-row input::placeholder { color: var(--muted); }
        .bank-add-row button {
            background: var(--sage);
            border: none; border-radius: 6px; padding: 7px 16px;
            font-weight: 500; font-size: 0.82rem; color: #fff;
            cursor: pointer; font-family: 'Outfit', sans-serif;
            flex-shrink: 0; transition: all 0.15s ease;
        }
        .bank-add-row button:hover { background: #6a8a68; }

        /* ---- REWARDS PAGE ---- */
        .rewards-title {
            font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 600;
            text-align: center; margin-bottom: 6px;
            color: var(--gold);
        }
        .rewards-sub {
            text-align: center; font-size: 0.82rem; color: var(--muted);
            margin-bottom: 22px; line-height: 1.6; letter-spacing: 0.02em;
        }
        .rewards-summary {
            display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .rewards-stat {
            background: var(--card); border: 1.5px solid var(--border); border-radius: 10px;
            padding: 16px 24px; text-align: center;
            min-width: 110px;
        }
        .rewards-stat .num {
            font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 700;
            color: var(--terracotta); line-height: 1;
        }
        .rewards-stat .label {
            font-size: 0.68rem; text-transform: uppercase; font-weight: 500;
            color: var(--muted); margin-top: 6px; letter-spacing: 0.1em;
        }
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px; margin-bottom: 26px;
        }
        .badge-card {
            background: var(--card); border: 1.5px solid var(--border); border-radius: 12px;
            padding: 18px 10px; text-align: center;
            transition: all 0.2s ease; position: relative;
        }
        .badge-card.earned {
            border-color: var(--gold);
            background: linear-gradient(160deg, #fdfaf0, #f8f2e0);
        }
        .badge-emoji {
            font-size: 2.4rem; line-height: 1;
            filter: grayscale(1) opacity(0.25);
            transition: filter 0.3s;
        }
        .badge-card.earned .badge-emoji { filter: none; }
        .badge-name {
            font-family: 'Cormorant Garamond', serif; font-size: 0.9rem; font-weight: 600;
            margin-top: 8px; color: var(--text);
            line-height: 1.2;
        }
        .badge-card.earned .badge-name { color: #8a6a2a; }
        .badge-day {
            font-size: 0.62rem; color: var(--muted); margin-top: 4px;
            font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em;
        }
        .badge-lock {
            position: absolute; top: 8px; right: 10px;
            font-size: 0.8rem; opacity: 0.4;
        }
        .badge-card.earned .badge-lock { display: none; }
        .badge-check {
            position: absolute; top: 8px; right: 10px;
            font-size: 0.85rem;
        }

        .gift-section {
            background: var(--card); border: 1.5px dashed var(--gold); border-radius: 14px;
            padding: 20px;
        }
        .gift-title {
            font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 600;
            color: #8a6a2a; text-align: center; margin-bottom: 6px;
        }
        .gift-desc {
            text-align: center; font-size: 0.8rem; color: var(--muted);
            margin-bottom: 16px; line-height: 1.6;
        }
        .gift-progress-outer {
            background: #f5eedc; border: 1px solid #e0d0b0; border-radius: 6px;
            height: 8px; overflow: hidden; position: relative;
            margin-bottom: 8px;
        }
        .gift-progress-inner {
            height: 100%; border-radius: 6px; width: 0%;
            background: linear-gradient(90deg, var(--sand), var(--terracotta));
            transition: width 0.5s ease;
        }
        .gift-progress-label {
            text-align: center; font-size: 0.78rem; font-weight: 500;
            color: #8a6a2a;
        }
        .gift-unlock {
            text-align: center; padding: 14px; margin-top: 12px;
            background: #faf7ee;
            border-radius: 10px; border: 1px solid #e0d0b0;
        }
        .gift-unlock .gift-emoji { font-size: 2rem; }
        .gift-unlock .gift-msg {
            font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 600;
            color: #8a6a2a; margin-top: 6px;
        }
        .gift-unlock .gift-hint {
            font-size: 0.72rem; color: var(--muted); margin-top: 4px;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(46,42,36,0.4);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 10001; padding: 16px; animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-box {
            background: #fff; border: 1.5px solid var(--border); border-radius: 14px;
            padding: 24px; max-width: 440px; width: 100%; max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(46,42,36,0.15);
        }
        .modal-title {
            font-family: 'Cormorant Garamond', serif; font-weight: 600;
            font-size: 1.35rem; color: var(--charcoal); margin-bottom: 18px;
            text-align: center;
        }
        .modal-item {
            display: block; width: 100%; text-align: left;
            background: var(--card-2); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px 16px;
            font-size: 0.9rem; font-family: inherit; color: var(--text);
            cursor: pointer; margin-bottom: 8px; transition: all 0.15s ease;
            font-weight: 500;
        }
        .modal-item:hover { background: #faf6f2; border-color: var(--terracotta); }
        .modal-item.special {
            background: #f0f5ee;
            border-color: var(--sage); color: var(--sage); font-weight: 600;
        }
        .modal-item.special:hover { background: #e4ede0; }
        .modal-empty { text-align: center; color: var(--muted); padding: 20px; font-size: 0.85rem; line-height: 1.6; }
        .modal-cancel {
            display: block; width: 100%; background: transparent;
            border: 1px solid var(--border); border-radius: 8px; padding: 12px;
            font-weight: 500; font-size: 0.85rem; color: var(--muted);
            cursor: pointer; margin-top: 8px; font-family: inherit; transition: all 0.15s ease;
        }
        .modal-cancel:hover { background: var(--card-2); color: var(--text); }

        /* CELEBRATIONS */
        .celebration-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; align-items: center; justify-content: center;
            z-index: 9999; visibility: hidden;
        }
        .celebration-overlay.active { visibility: visible; animation: popFade 1.8s ease forwards; }
        .confetti-burst {
            font-size: 4rem;
            animation: floatUp 1.6s ease-out;
            display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: center;
        }
        @keyframes popFade {
            0% { opacity: 0; transform: scale(0.7); } 20% { opacity: 1; transform: scale(1.05); }
            40% { transform: scale(1); } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; }
        }
        @keyframes floatUp {
            0% { transform: translateY(30px); opacity: 0; }
            20% { opacity: 1; transform: translateY(-10px); }
            60% { transform: translateY(-30px); }
            100% { transform: translateY(-80px); opacity: 0; }
        }

        .full-day-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(193,122,92,0.95), rgba(122,90,122,0.95));
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; visibility: hidden; pointer-events: none;
            text-align: center; padding: 20px;
        }
        .full-day-overlay.active { visibility: visible; animation: fullDayAnim 3.4s ease forwards; }
        @keyframes fullDayAnim {
            0% { opacity: 0; transform: scale(0.6); } 15% { opacity: 1; transform: scale(1.03); }
            25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.1); }
        }
        .full-day-overlay .big-emoji {
            font-size: 6rem; animation: bounceBig 0.8s ease infinite alternate;
            filter: drop-shadow(0 0 30px rgba(184,150,62,0.6));
        }
        @keyframes bounceBig {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-18px) scale(1.05); }
        }
        .full-day-overlay .msg {
            font-family: 'Cormorant Garamond', serif; font-size: 2.6rem; font-weight: 700;
            color: #fff; margin: 18px 0 14px;
            text-shadow: 0 4px 18px rgba(0,0,0,0.2);
        }
        .full-day-overlay .sub-msg {
            font-size: 1rem; font-weight: 500; color: var(--text);
            background: #fff; padding: 12px 26px; border-radius: 30px;
        }
        .full-day-overlay .badge-earned {
            margin-top: 18px; background: rgba(255,255,255,0.2);
            border: 1.5px solid rgba(255,255,255,0.4);
            padding: 12px 22px; border-radius: 30px;
            display: flex; align-items: center; gap: 8px;
            color: #fff; font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem; font-weight: 600;
        }

        .footer-note {
            position: relative; z-index: 1; margin-top: 30px;
            font-size: 0.7rem; color: var(--muted);
            text-align: center; letter-spacing: 0.08em;
            text-transform: uppercase; font-weight: 500;
        }

        @media (max-width: 500px) {
            h1 { font-size: 2rem; }
            .day-title { font-size: 1.7rem; }
            .bank-title, .rewards-title { font-size: 1.6rem; }
            .nav-btn { padding: 8px 11px; font-size: 0.72rem; }
            .full-day-overlay .msg { font-size: 1.9rem; }
            .badges-grid { grid-template-columns: repeat(2, 1fr); }
            .task-time-row { padding-left: 0; }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>🌿 LoLo's Wellness Planner</h1>
        <div class="subhead">
            <span class="dot"></span>
            <span>Self-Care · Family · Well-Being</span>
            <span class="dot"></span>
        </div>
    </div>

    <div class="page-nav" id="pageNav"></div>
    <div class="page-content" id="pageContent"></div>

    <div class="footer-note">✦ For the woman who cares for everyone — remember to care for yourself ✦</div>

    <div class="celebration-overlay" id="celebration">
        <div class="confetti-burst" id="confettiBurst">🌿✨🌸</div>
    </div>
    <div class="full-day-overlay" id="fullDayOverlay">
        <div class="big-emoji" id="fullDayEmoji">🌿</div>
        <div class="msg" id="fullDayMsg">A DAY WELL LIVED</div>
        <div class="sub-msg" id="fullDaySubMsg">All tasks complete!</div>
        <div class="badge-earned" id="fullDayBadge" style="display:none;"></div>
    </div>

    <script>
    (function() {
        'use strict';

        const DAYS = [
            { name: 'Monday', emoji: '🌅', badge: '☀️', badgeName: 'Gentle Start' },
            { name: 'Tuesday', emoji: '🌿', badge: '🌿', badgeName: 'Nourish' },
            { name: 'Wednesday', emoji: '💧', badge: '💧', badgeName: 'Hydrate' },
            { name: 'Thursday', emoji: '🌱', badge: '🌱', badgeName: 'Grow' },
            { name: 'Friday', emoji: '🌻', badge: '🌻', badgeName: 'Bloom' },
            { name: 'Saturday', emoji: '🕯️', badge: '🕯️', badgeName: 'Slow Down' },
            { name: 'Sunday', emoji: '🕊️', badge: '🕊️', badgeName: 'Rest & Restore' }
        ];

        // Wellness-focused milestones
        const GIFTS = [
            { required: 3, emoji: '🧖‍♀️', name: 'A Quiet Evening', hint: 'Earn 3 badges' },
            { required: 5, emoji: '💆‍♀️', name: 'A Spa Day', hint: 'Earn 5 badges' },
            { required: 7, emoji: '🌺', name: 'A Weekend Retreat', hint: 'Earn all 7 badges' }
        ];

        const PEOPLE = [
            { key: 'kid1', label: 'Emma (7)', color: 'kid1', emoji: '👧' },
            { key: 'kid2', label: 'Leo (5)', color: 'kid2', emoji: '👦' },
            { key: 'kid3', label: 'Mia (3)', color: 'kid3', emoji: '🧒' },
            { key: 'mom',  label: 'Me-Time & Self-Care', color: 'mom', emoji: '🌿' }
        ];

        let subjectBank = [];
        let days = [];
        let badges = {};
        let nextId = 1;
        function genId() { return 'id_' + (nextId++) + '_' + Math.random().toString(36).slice(2,7); }

        const STORAGE_KEY = 'lolosWellness_v1';

        function saveToStorage() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ subjectBank, days, badges, nextId })); } catch(e) {}
        }
        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data && Array.isArray(data.subjectBank) && Array.isArray(data.days) && data.days.length === 7) {
                    subjectBank = data.subjectBank;
                    days = data.days;
                    badges = data.badges || {};
                    nextId = data.nextId || 1;
                    for (let d = 0; d < 7; d++) if (!Array.isArray(days[d])) days[d] = [];
                    days.forEach(function(dayArr) {
                        dayArr.forEach(function(subj) {
                            (subj.tasks || []).forEach(function(task) {
                                if (!Array.isArray(task.links)) task.links = [];
                                if (!Array.isArray(task.notes)) task.notes = [];
                                if (!task.from) task.from = '';
                                if (!task.to) task.to = '';
                            });
                        });
                    });
                    subjectBank.forEach(function(bs) {
                        (bs.tasks || []).forEach(function(task) {
                            if (!Array.isArray(task.links)) task.links = [];
                            if (!Array.isArray(task.notes)) task.notes = [];
                            if (!task.from) task.from = '';
                            if (!task.to) task.to = '';
                        });
                    });
                }
            } catch(e) {}
        }

        // ---- gentle sounds ----
        function playTone(freq, duration, type, vol) {
            freq = freq || 440; duration = duration || 0.15; type = type || 'sine'; vol = vol || 0.08;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = type; osc.frequency.value = freq; gain.gain.value = vol;
                osc.connect(gain); gain.connect(ctx.destination); osc.start();
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }
        function playClick() { playTone(520, 0.06, 'sine', 0.05); }
        function playCheck() { playTone(660, 0.12, 'sine', 0.06); setTimeout(function(){ playTone(880, 0.1, 'sine', 0.05); }, 80); }
        function playUncheck() { playTone(400, 0.1, 'sine', 0.05); }
        function playOpen() { playTone(500, 0.05, 'sine', 0.04); }
        function playClose() { playTone(380, 0.05, 'sine', 0.04); }
        function playAdd() { playTone(600, 0.07, 'sine', 0.05); setTimeout(function(){ playTone(800, 0.07, 'sine', 0.05); }, 70); }
        function playRemove() { playTone(400, 0.08, 'sine', 0.04); }
        function playCelebrationSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                [523.25, 659.25, 783.99].forEach(function(freq, i) {
                    const osc = ctx.createOscillator(); const g = ctx.createGain();
                    osc.type = 'sine'; osc.frequency.value = freq;
                    g.gain.setValueAtTime(0.08, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.12 + 0.5);
                    osc.connect(g); g.connect(ctx.destination);
                    osc.start(now + i * 0.12); osc.stop(now + i * 0.12 + 0.5);
                });
            } catch(e) {}
        }
        function playFanfare() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                [[523.25,0],[659.25,0.2],[783.99,0.4],[1046.50,0.65],[1318.51,0.9]]
                .forEach(function(pair) {
                    const freq = pair[0], t = pair[1];
                    const osc = ctx.createOscillator(); const g = ctx.createGain();
                    osc.type = 'sine'; osc.frequency.value = freq;
                    g.gain.setValueAtTime(0.1, now + t);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.6);
                    osc.connect(g); g.connect(ctx.destination);
                    osc.start(now + t); osc.stop(now + t + 0.6);
                });
            } catch(e) {}
        }

        // ---- celebrations ----
        const celebrationOverlay = document.getElementById('celebration');
        const confettiBurst = document.getElementById('confettiBurst');
        const fullDayOverlay = document.getElementById('fullDayOverlay');
        const fullDayEmoji = document.getElementById('fullDayEmoji');
        const fullDayMsg = document.getElementById('fullDayMsg');
        const fullDaySubMsg = document.getElementById('fullDaySubMsg');
        const fullDayBadge = document.getElementById('fullDayBadge');

        function celebrate() {
            playCelebrationSound();
            const emojis = ['🌿','🌸','✨','🌱','💧','🌻','🕊️','🌺','☕','🕯️'];
            let html = '';
            for (let i = 0; i < 10; i++) html += emojis[Math.floor(Math.random() * emojis.length)];
            confettiBurst.textContent = html;
            celebrationOverlay.classList.remove('active');
            void celebrationOverlay.offsetWidth;
            celebrationOverlay.classList.add('active');
            setTimeout(function() { celebrationOverlay.classList.remove('active'); }, 1800);
        }
        const fullDayRewards = [
            { emoji: '🌿', msg: 'A DAY WELL LIVED', sub: 'You showed up for yourself today.' },
            { emoji: '🌸', msg: 'GENTLE & STRONG', sub: 'Every task, a small act of care.' },
            { emoji: '✨', msg: 'YOU MATTER', sub: 'And you made time for yourself.' },
            { emoji: '🕊️', msg: 'IN BALANCE', sub: 'Family and self — both held.' },
            { emoji: '🌺', msg: 'BEAUTIFULLY DONE', sub: 'A full day of caring.' }
        ];
        function celebrateFullDay(dayIdx) {
            playFanfare();
            const r = fullDayRewards[Math.floor(Math.random() * fullDayRewards.length)];
            fullDayEmoji.textContent = r.emoji;
            fullDayMsg.textContent = r.msg;
            fullDaySubMsg.textContent = r.sub;

            if (dayIdx !== undefined && DAYS[dayIdx]) {
                fullDayBadge.style.display = 'flex';
                fullDayBadge.innerHTML = '<span style="font-size:1.3rem;">' + DAYS[dayIdx].badge + '</span><span>Badge earned: ' + DAYS[dayIdx].badgeName + '</span>';
            } else {
                fullDayBadge.style.display = 'none';
            }

            fullDayOverlay.classList.remove('active');
            void fullDayOverlay.offsetWidth;
            fullDayOverlay.classList.add('active');
            setTimeout(function() { fullDayOverlay.classList.remove('active'); }, 3400);
        }

        // ---- nav ----
        let currentPage = 'day0';
        const pageNav = document.getElementById('pageNav');
        const pageContent = document.getElementById('pageContent');

        function renderNav() {
            pageNav.innerHTML = '';
            DAYS.forEach(function(day, idx) {
                const btn = document.createElement('button');
                btn.className = 'nav-btn' + (currentPage === 'day' + idx ? ' active' : '');
                btn.innerHTML = day.emoji + ' ' + day.name;
                btn.addEventListener('click', function() { playClick(); goToPage('day' + idx); });
                pageNav.appendChild(btn);
            });
            const bankBtn = document.createElement('button');
            bankBtn.className = 'nav-btn bank-btn' + (currentPage === 'bank' ? ' active' : '');
            bankBtn.innerHTML = '📋 Task Library';
            bankBtn.addEventListener('click', function() { playClick(); goToPage('bank'); });
            pageNav.appendChild(bankBtn);
            const rewardsBtn = document.createElement('button');
            rewardsBtn.className = 'nav-btn rewards-btn' + (currentPage === 'rewards' ? ' active' : '');
            rewardsBtn.innerHTML = '🏆 Milestones';
            rewardsBtn.addEventListener('click', function() { playClick(); goToPage('rewards'); });
            pageNav.appendChild(rewardsBtn);
        }

        function goToPage(pageId) {
            currentPage = pageId;
            renderNav();
            renderPage();
        }

        function renderPage() {
            pageContent.innerHTML = '';
            if (currentPage === 'bank') {
                pageContent.appendChild(renderBankPage());
            } else if (currentPage === 'rewards') {
                pageContent.appendChild(renderRewardsPage());
            } else {
                const dayIdx = parseInt(currentPage.replace('day', ''), 10);
                pageContent.appendChild(renderDayPage(dayIdx));
            }
        }

        // ---- DAY PAGE ----
        function renderDayPage(dayIdx) {
            const wrap = document.createElement('div');
            const day = DAYS[dayIdx];

            const title = document.createElement('div');
            title.className = 'day-title';
            title.textContent = day.emoji + ' ' + day.name;
            wrap.appendChild(title);

            const prog = document.createElement('div');
            prog.className = 'day-progress';
            prog.id = 'day-progress-' + dayIdx;
            wrap.appendChild(prog);

            if (days[dayIdx].length === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.textContent = 'No activities yet. Tap "＋ Add Activity" below to begin.';
                wrap.appendChild(hint);
            } else {
                days[dayIdx].forEach(function(daySubject, subjIdx) {
                    wrap.appendChild(renderSubjectBlock(dayIdx, subjIdx, daySubject));
                });
            }

            const addSubjBtn = document.createElement('button');
            addSubjBtn.type = 'button';
            addSubjBtn.className = 'btn-add-subject';
            addSubjBtn.textContent = '＋ Add Activity / Area';
            addSubjBtn.addEventListener('click', function() { playAdd(); openSubjectPicker(dayIdx); });
            wrap.appendChild(addSubjBtn);

            setTimeout(function() { updateDayProgress(dayIdx); }, 0);
            return wrap;
        }

        let expandedState = {};
        function isExpanded(dayIdx, subjIdx) {
            return expandedState[dayIdx + '_' + subjIdx] === true;
        }
        function setExpanded(dayIdx, subjIdx, val) {
            expandedState[dayIdx + '_' + subjIdx] = val;
        }

        function getSubjectColorClass(subj) {
            const bankSubj = subjectBank.find(function(s) { return s.id === subj.bankSubjectId; });
            if (!bankSubj) return '';
            if (bankSubj.category) return bankSubj.category;
            const n = bankSubj.name.toLowerCase();
            if (n.includes('emma') || n.includes('kid 1') || n.includes('child 1')) return 'kid1';
            if (n.includes('leo') || n.includes('kid 2') || n.includes('child 2')) return 'kid2';
            if (n.includes('mia') || n.includes('kid 3') || n.includes('child 3')) return 'kid3';
            if (n.includes('mom') || n.includes('me-time') || n.includes('self') || n.includes('wellness')) return 'mom';
            return '';
        }

        function renderSubjectBlock(dayIdx, subjIdx, daySubject) {
            const block = document.createElement('div');
            block.className = 'subject-block ' + getSubjectColorClass(daySubject);
            const expanded = isExpanded(dayIdx, subjIdx);
            if (expanded) block.classList.add('expanded');

            const bankSubj = subjectBank.find(function(s) { return s.id === daySubject.bankSubjectId; });
            const displayName = bankSubj ? bankSubj.name : 'Unknown activity';

            const taskCount = daySubject.tasks.length;
            const doneCount = daySubject.tasks.filter(function(t){ return t.done; }).length;

            const header = document.createElement('div');
            header.className = 'subject-header';
            header.addEventListener('click', function(e) {
                if (e.target.closest('.btn-icon')) return;
                const nowExpanded = !isExpanded(dayIdx, subjIdx);
                setExpanded(dayIdx, subjIdx, nowExpanded);
                if (nowExpanded) { playOpen(); } else { playClose(); }
                renderPage();
            });

            const nameEl = document.createElement('div');
            nameEl.className = 'subject-name-display';
            nameEl.innerHTML = '<span class="subject-chevron">▶</span> ' + displayName;
            header.appendChild(nameEl);

            const countEl = document.createElement('span');
            countEl.className = 'subject-task-count';
            countEl.textContent = taskCount > 0 ? doneCount + '/' + taskCount : '0 tasks';
            header.appendChild(countEl);

            const removeSubjBtn = document.createElement('button');
            removeSubjBtn.type = 'button';
            removeSubjBtn.className = 'btn-icon';
            removeSubjBtn.textContent = '✕';
            removeSubjBtn.title = 'Remove from this day';
            removeSubjBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (confirm('Remove "' + displayName + '" from ' + DAYS[dayIdx].name + '?')) {
                    playRemove();
                    days[dayIdx].splice(subjIdx, 1);
                    saveToStorage();
                    renderPage();
                }
            });
            header.appendChild(removeSubjBtn);
            block.appendChild(header);

            const body = document.createElement('div');
            body.className = 'subject-body';

            const taskList = document.createElement('div');
            taskList.className = 'task-list';

            if (daySubject.tasks.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.textContent = 'No tasks yet — add some from the library below';
                taskList.appendChild(hint);
            } else {
                daySubject.tasks.forEach(function(task, taskIdx) {
                    taskList.appendChild(renderTaskItem(dayIdx, subjIdx, taskIdx, task));
                });
            }
            body.appendChild(taskList);

            const addTaskBtn = document.createElement('button');
            addTaskBtn.type = 'button';
            addTaskBtn.className = 'btn-add-task';
            if (!bankSubj || bankSubj.tasks.length === 0) {
                addTaskBtn.disabled = true;
                addTaskBtn.textContent = '＋ Add task · library is empty';
            } else {
                addTaskBtn.textContent = '＋ Add task from library';
                addTaskBtn.addEventListener('click', function() { playAdd(); openTaskPicker(dayIdx, subjIdx, bankSubj); });
            }
            body.appendChild(addTaskBtn);

            block.appendChild(body);
            return block;
        }

        // ---- TASK ITEM (with From / To times) ----
        function renderTaskItem(dayIdx, subjIdx, taskIdx, task) {
            if (!Array.isArray(task.links)) task.links = [];
            if (!Array.isArray(task.notes)) task.notes = [];
            if (!task.from) task.from = '';
            if (!task.to) task.to = '';

            const item = document.createElement('div');
            item.className = 'task-item' + (task.done ? ' done' : '');

            const mainRow = document.createElement('div');
            mainRow.className = 'task-main-row';

            const checkBtn = document.createElement('button');
            checkBtn.type = 'button';
            checkBtn.className = 'task-check' + (task.done ? ' done' : '');
            checkBtn.textContent = task.done ? '✓' : '';
            checkBtn.addEventListener('click', function() {
                task.done = !task.done;
                saveToStorage();
                if (task.done) { playCheck(); celebrate(); } else { playUncheck(); }
                renderPage();
            });
            mainRow.appendChild(checkBtn);

            const text = document.createElement('div');
            text.className = 'task-text-display';
            text.textContent = task.text;
            mainRow.appendChild(text);

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'task-remove';
            removeBtn.textContent = '✕';
            removeBtn.title = 'Remove task';
            removeBtn.addEventListener('click', function() {
                if (confirm('Remove this task?')) {
                    playRemove();
                    days[dayIdx][subjIdx].tasks.splice(taskIdx, 1);
                    saveToStorage();
                    renderPage();
                }
            });
            mainRow.appendChild(removeBtn);
            item.appendChild(mainRow);

            // ---- TIME RANGE ROW ----
            const timeRow = document.createElement('div');
            timeRow.className = 'task-time-row';

            const fromLabel = document.createElement('span');
            fromLabel.className = 'time-label';
            fromLabel.textContent = 'From:';
            timeRow.appendChild(fromLabel);

            const fromInput = document.createElement('input');
            fromInput.type = 'time';
            fromInput.className = 'time-input';
            fromInput.value = task.from || '';
            fromInput.addEventListener('change', function(e) {
                task.from = e.target.value;
                saveToStorage();
            });
            timeRow.appendChild(fromInput);

            const sep = document.createElement('span');
            sep.className = 'time-sep';
            sep.textContent = '→';
            timeRow.appendChild(sep);

            const toLabel = document.createElement('span');
            toLabel.className = 'time-label';
            toLabel.textContent = 'To:';
            timeRow.appendChild(toLabel);

            const toInput = document.createElement('input');
            toInput.type = 'time';
            toInput.className = 'time-input';
            toInput.value = task.to || '';
            toInput.addEventListener('change', function(e) {
                task.to = e.target.value;
                saveToStorage();
            });
            timeRow.appendChild(toInput);

            item.appendChild(timeRow);

            item.appendChild(buildExtrasSection(task, function() { saveToStorage(); renderPage(); }));
            return item;
        }

        function buildExtrasSection(task, onUpdate) {
            const extras = document.createElement('div');
            extras.className = 'task-extras';

            const totalExtras = task.links.length + task.notes.length;
            const toggleBtn = document.createElement('button');
            toggleBtn.type = 'button';
            toggleBtn.className = 'extras-toggle';
            toggleBtn.innerHTML = '📎 Links & Notes' + (totalExtras > 0 ? ' <span class="badge">' + totalExtras + '</span>' : '');
            extras.appendChild(toggleBtn);

            const panel = document.createElement('div');
            panel.className = 'extras-panel';
            panel.style.display = totalExtras > 0 ? 'flex' : 'none';

            task.links.forEach(function(link, linkIdx) {
                panel.appendChild(renderLinkRow(task, link, linkIdx, onUpdate));
            });
            task.notes.forEach(function(note, noteIdx) {
                panel.appendChild(renderNoteRow(task, note, noteIdx, onUpdate));
            });

            const addRow = document.createElement('div');
            addRow.className = 'extras-add-row';

            const addLinkBtn = document.createElement('button');
            addLinkBtn.type = 'button';
            addLinkBtn.className = 'extras-add-btn';
            addLinkBtn.textContent = '🔗 + Link';
            addLinkBtn.addEventListener('click', function() {
                playAdd();
                task.links.push({ id: genId(), url: '' });
                onUpdate();
            });
            addRow.appendChild(addLinkBtn);

            const addNoteBtn = document.createElement('button');
            addNoteBtn.type = 'button';
            addNoteBtn.className = 'extras-add-btn note-add';
            addNoteBtn.textContent = '📝 + Note';
            addNoteBtn.addEventListener('click', function() {
                playAdd();
                task.notes.push({ id: genId(), text: '' });
                onUpdate();
            });
            addRow.appendChild(addNoteBtn);

            panel.appendChild(addRow);
            extras.appendChild(panel);

            toggleBtn.addEventListener('click', function() {
                const isHidden = panel.style.display === 'none';
                panel.style.display = isHidden ? 'flex' : 'none';
                if (isHidden) playOpen(); else playClose();
            });

            return extras;
        }

        function renderLinkRow(task, link, linkIdx, onUpdate) {
            const row = document.createElement('div');
            row.className = 'link-item';

            const icon = document.createElement('span');
            icon.className = 'link-icon';
            icon.textContent = '🔗';
            row.appendChild(icon);

            const urlInput = document.createElement('input');
            urlInput.className = 'link-input';
            urlInput.type = 'text';
            urlInput.placeholder = 'Paste URL';
            urlInput.value = link.url || '';
            urlInput.addEventListener('input', function(e) {
                link.url = e.target.value;
                saveToStorage();
            });
            row.appendChild(urlInput);

            const openBtn = document.createElement('a');
            openBtn.className = 'link-open';
            openBtn.textContent = 'Open';
            openBtn.target = '_blank';
            openBtn.rel = 'noopener noreferrer';
            openBtn.href = 'javascript:void(0)';
            openBtn.addEventListener('click', function(e) {
                e.preventDefault();
                playClick();
                let url = (link.url || '').trim();
                if (!url) { alert('Paste a URL first'); return; }
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                window.open(url, '_blank', 'noopener,noreferrer');
            });
            row.appendChild(openBtn);

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'remove-mini';
            removeBtn.textContent = '✕';
            removeBtn.addEventListener('click', function() {
                playRemove();
                task.links.splice(linkIdx, 1);
                onUpdate();
            });
            row.appendChild(removeBtn);

            return row;
        }

        function renderNoteRow(task, note, noteIdx, onUpdate) {
            const row = document.createElement('div');
            row.className = 'note-item';

            const icon = document.createElement('span');
            icon.className = 'link-icon';
            icon.textContent = '📝';
            row.appendChild(icon);

            const textarea = document.createElement('textarea');
            textarea.className = 'note-textarea';
            textarea.placeholder = 'Write a note…';
            textarea.rows = 1;
            textarea.value = note.text || '';
            textarea.addEventListener('input', function(e) {
                note.text = e.target.value;
                e.target.style.height = 'auto';
                e.target.style.height = Math.min(e.target.scrollHeight, 180) + 'px';
                saveToStorage();
            });
            row.appendChild(textarea);

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'remove-mini';
            removeBtn.textContent = '✕';
            removeBtn.addEventListener('click', function() {
                playRemove();
                task.notes.splice(noteIdx, 1);
                onUpdate();
            });
            row.appendChild(removeBtn);

            setTimeout(function() {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 180) + 'px';
            }, 0);

            return row;
        }

        function updateDayProgress(dayIdx) {
            const prog = document.getElementById('day-progress-' + dayIdx);
            if (!prog) return;
            let total = 0, done = 0;
            days[dayIdx].forEach(function(subj) {
                subj.tasks.forEach(function(t) { total++; if (t.done) done++; });
            });
            if (total === 0) { prog.textContent = 'No tasks yet'; prog.classList.remove('complete'); return; }
            if (done === total) {
                prog.classList.add('complete');
                prog.textContent = done + ' of ' + total + ' — complete';
                if (!badges[dayIdx]) {
                    badges[dayIdx] = true;
                    saveToStorage();
                    celebrateFullDay(dayIdx);
                }
            } else {
                prog.classList.remove('complete');
                prog.textContent = done + ' of ' + total + ' tasks complete';
            }
        }

        // ---- SUBJECT PICKER ----
        function openSubjectPicker(dayIdx) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            const box = document.createElement('div');
            box.className = 'modal-box';

            const h = document.createElement('div');
            h.className = 'modal-title';
            h.textContent = 'Choose an area for ' + DAYS[dayIdx].name;
            box.appendChild(h);

            if (subjectBank.length === 0) {
                const e = document.createElement('div');
                e.className = 'modal-empty';
                e.textContent = 'Your library is empty. Create your first area below, or visit the Task Library first.';
                box.appendChild(e);
            } else {
                subjectBank.forEach(function(bs) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'modal-item';
                    btn.textContent = bs.name + (bs.tasks.length ? '  ·  ' + bs.tasks.length + ' tasks' : '  ·  no tasks yet');
                    btn.addEventListener('click', function() {
                        playAdd();
                        addDaySubject(dayIdx, bs.id);
                        document.body.removeChild(overlay);
                    });
                    box.appendChild(btn);
                });
            }

            const createBtn = document.createElement('button');
            createBtn.type = 'button';
            createBtn.className = 'modal-item special';
            createBtn.textContent = '✦ Create a new area';
            createBtn.addEventListener('click', function() {
                const name = prompt('Name (e.g. Morning Ritual, Emma, Movement, Nutrition):');
                if (!name || !name.trim()) return;
                const bs = { id: genId(), name: name.trim(), tasks: [] };
                const n = name.toLowerCase();
                if (n.includes('emma')) bs.category = 'kid1';
                else if (n.includes('leo')) bs.category = 'kid2';
                else if (n.includes('mia')) bs.category = 'kid3';
                else if (n.includes('mom') || n.includes('me') || n.includes('self') || n.includes('wellness')) bs.category = 'mom';
                subjectBank.push(bs);
                addDaySubject(dayIdx, bs.id);
                saveToStorage();
                document.body.removeChild(overlay);
                playAdd();
            });
            box.appendChild(createBtn);

            const cancelBtn = document.createElement('button');
            cancelBtn.type = 'button';
            cancelBtn.className = 'modal-cancel';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.addEventListener('click', function() { playClose(); document.body.removeChild(overlay); });
            box.appendChild(cancelBtn);

            overlay.appendChild(box);
            overlay.addEventListener('click', function(e) { if (e.target === overlay) { playClose(); document.body.removeChild(overlay); } });
            document.body.appendChild(overlay);
        }

        function addDaySubject(dayIdx, bankSubjectId) {
            days[dayIdx].push({ id: genId(), bankSubjectId: bankSubjectId, tasks: [] });
            saveToStorage();
            setExpanded(dayIdx, days[dayIdx].length - 1, true);
            renderPage();
        }

        // ---- TASK PICKER ----
        function openTaskPicker(dayIdx, subjIdx, bankSubj) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            const box = document.createElement('div');
            box.className = 'modal-box';

            const h = document.createElement('div');
            h.className = 'modal-title';
            h.textContent = 'Add task to ' + bankSubj.name;
            box.appendChild(h);

            if (bankSubj.tasks.length === 0) {
                const e = document.createElement('div');
                e.className = 'modal-empty';
                e.textContent = 'This area has no tasks in the library yet. Visit the Task Library to add some first.';
                box.appendChild(e);
            } else {
                bankSubj.tasks.forEach(function(task) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'modal-item';
                    btn.textContent = task.text;
                    btn.addEventListener('click', function() {
                        const copiedLinks = (task.links || []).map(function(l) { return { id: genId(), url: l.url || '' }; });
                        const copiedNotes = (task.notes || []).map(function(n) { return { id: genId(), text: n.text || '' }; });
                        days[dayIdx][subjIdx].tasks.push({
                            id: genId(),
                            text: task.text,
                            done: false,
                            from: task.from || '',
                            to: task.to || '',
                            links: copiedLinks,
                            notes: copiedNotes
                        });
                        saveToStorage();
                        document.body.removeChild(overlay);
                        playAdd();
                        renderPage();
                    });
                    box.appendChild(btn);
                });
            }

            const cancelBtn = document.createElement('button');
            cancelBtn.type = 'button';
            cancelBtn.className = 'modal-cancel';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.addEventListener('click', function() { playClose(); document.body.removeChild(overlay); });
            box.appendChild(cancelBtn);

            overlay.appendChild(box);
            overlay.addEventListener('click', function(e) { if (e.target === overlay) { playClose(); document.body.removeChild(overlay); } });
            document.body.appendChild(overlay);
        }

        // ---- BANK PAGE ----
        function renderBankPage() {
            const wrap = document.createElement('div');

            const title = document.createElement('div');
            title.className = 'bank-title';
            title.textContent = '📋 Task Library';
            wrap.appendChild(title);

            const sub = document.createElement('div');
            sub.className = 'bank-sub';
            sub.textContent = 'Your reusable tasks — for the family and for yourself';
            wrap.appendChild(sub);

            const addBankSubjBtn = document.createElement('button');
            addBankSubjBtn.type = 'button';
            addBankSubjBtn.className = 'btn-add-bank-subject';
            addBankSubjBtn.textContent = '＋ Add new area';
            addBankSubjBtn.addEventListener('click', function() {
                const name = prompt('Name (e.g. Morning Ritual, Emma, Movement, Nutrition):');
                if (!name || !name.trim()) return;
                const bs = { id: genId(), name: name.trim(), tasks: [] };
                const n = name.toLowerCase();
                if (n.includes('emma')) bs.category = 'kid1';
                else if (n.includes('leo')) bs.category = 'kid2';
                else if (n.includes('mia')) bs.category = 'kid3';
                else if (n.includes('mom') || n.includes('me') || n.includes('self') || n.includes('wellness')) bs.category = 'mom';
                subjectBank.push(bs);
                saveToStorage();
                playAdd();
                renderPage();
            });
            wrap.appendChild(addBankSubjBtn);

            if (subjectBank.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.style.padding = '30px';
                hint.textContent = 'No areas yet. Add your first one above.';
                wrap.appendChild(hint);
            } else {
                subjectBank.forEach(function(bs, bsIdx) {
                    wrap.appendChild(renderBankSubjectCard(bs, bsIdx));
                });
            }
            return wrap;
        }

        function renderBankSubjectCard(bs, bsIdx) {
            const card = document.createElement('div');
            card.className = 'bank-subject-card';

            const header = document.createElement('div');
            header.className = 'bank-subject-header';

            const nameInput = document.createElement('input');
            nameInput.className = 'bank-subject-name-input';
            nameInput.type = 'text';
            nameInput.value = bs.name;
            nameInput.addEventListener('input', function(e) {
                bs.name = e.target.value;
                saveToStorage();
            });
            header.appendChild(nameInput);

            const removeSubjBtn = document.createElement('button');
            removeSubjBtn.type = 'button';
            removeSubjBtn.className = 'btn-icon';
            removeSubjBtn.textContent = '✕';
            removeSubjBtn.title = 'Delete this area from the library';
            removeSubjBtn.addEventListener('click', function() {
                if (confirm('Delete "' + bs.name + '" and all its tasks?\n\nDays using it will show as "Unknown activity".')) {
                    playRemove();
                    subjectBank.splice(bsIdx, 1);
                    saveToStorage();
                    renderPage();
                }
            });
            header.appendChild(removeSubjBtn);
            card.appendChild(header);

            if (bs.tasks.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.textContent = 'No tasks here yet — add one below.';
                card.appendChild(hint);
            } else {
                bs.tasks.forEach(function(task, taskIdx) {
                    if (!Array.isArray(task.links)) task.links = [];
                    if (!Array.isArray(task.notes)) task.notes = [];
                    if (!task.from) task.from = '';
                    if (!task.to) task.to = '';

                    const item = document.createElement('div');
                    item.className = 'bank-item';

                    const mainRow = document.createElement('div');
                    mainRow.className = 'bank-main-row';

                    const text = document.createElement('input');
                    text.className = 'bank-task-input';
                    text.type = 'text';
                    text.value = task.text;
                    text.addEventListener('input', function(e) { task.text = e.target.value; saveToStorage(); });
                    mainRow.appendChild(text);

                    // Time range in bank
                    const fromLabel = document.createElement('span');
                    fromLabel.className = 'time-label';
                    fromLabel.textContent = 'From:';
                    mainRow.appendChild(fromLabel);
                    const fromInput = document.createElement('input');
                    fromInput.type = 'time';
                    fromInput.className = 'time-input';
                    fromInput.value = task.from || '';
                    fromInput.addEventListener('change', function(e) { task.from = e.target.value; saveToStorage(); });
                    mainRow.appendChild(fromInput);

                    const sep = document.createElement('span');
                    sep.className = 'time-sep';
                    sep.textContent = '→';
                    mainRow.appendChild(sep);

                    const toLabel = document.createElement('span');
                    toLabel.className = 'time-label';
                    toLabel.textContent = 'To:';
                    mainRow.appendChild(toLabel);
                    const toInput = document.createElement('input');
                    toInput.type = 'time';
                    toInput.className = 'time-input';
                    toInput.value = task.to || '';
                    toInput.addEventListener('change', function(e) { task.to = e.target.value; saveToStorage(); });
                    mainRow.appendChild(toInput);

                    const removeBtn = document.createElement('button');
                    removeBtn.type = 'button';
                    removeBtn.className = 'task-remove';
                    removeBtn.textContent = '✕';
                    removeBtn.addEventListener('click', function() {
                        if (confirm('Remove this task from the library?')) {
                            playRemove();
                            bs.tasks.splice(taskIdx, 1);
                            saveToStorage();
                            renderPage();
                        }
                    });
                    mainRow.appendChild(removeBtn);
                    item.appendChild(mainRow);

                    item.appendChild(buildExtrasSection(task, function() {
                        saveToStorage();
                        renderPage();
                    }));

                    card.appendChild(item);
                });
            }

            const addRow = document.createElement('div');
            addRow.className = 'bank-add-row';
            const newInput = document.createElement('input');
            newInput.type = 'text';
            newInput.placeholder = 'New task for ' + (bs.name || 'this area') + '…';
            addRow.appendChild(newInput);
            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.textContent = 'Add';
            addBtn.addEventListener('click', function() {
                const val = newInput.value.trim();
                if (!val) return;
                bs.tasks.push({ id: genId(), text: val, from: '', to: '', links: [], notes: [] });
                saveToStorage();
                playAdd();
                renderPage();
            });
            newInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') addBtn.click(); });
            addRow.appendChild(addBtn);
            card.appendChild(addRow);

            return card;
        }

        // ---- REWARDS PAGE ----
        function renderRewardsPage() {
            const wrap = document.createElement('div');

            const title = document.createElement('div');
            title.className = 'rewards-title';
            title.textContent = '🏆 Milestones';
            wrap.appendChild(title);

            const sub = document.createElement('div');
            sub.className = 'rewards-sub';
            sub.textContent = 'Every complete day earns a badge. Every badge is proof that you made time for yourself.';
            wrap.appendChild(sub);

            let earnedCount = 0;
            for (let d = 0; d < 7; d++) if (badges[d]) earnedCount++;

            const summary = document.createElement('div');
            summary.className = 'rewards-summary';

            const stat1 = document.createElement('div');
            stat1.className = 'rewards-stat';
            stat1.innerHTML = '<div class="num">' + earnedCount + '</div><div class="label">Badges Earned</div>';
            summary.appendChild(stat1);

            const stat2 = document.createElement('div');
            stat2.className = 'rewards-stat';
            stat2.innerHTML = '<div class="num">' + earnedCount + '/7</div><div class="label">This Week</div>';
            summary.appendChild(stat2);

            wrap.appendChild(summary);

            const badgesGrid = document.createElement('div');
            badgesGrid.className = 'badges-grid';

            DAYS.forEach(function(day, d) {
                const isEarned = !!badges[d];
                const card = document.createElement('div');
                card.className = 'badge-card' + (isEarned ? ' earned' : '');

                card.innerHTML =
                    '<div class="badge-emoji">' + day.badge + '</div>' +
                    '<div class="badge-name">' + day.badgeName + '</div>' +
                    '<div class="badge-day">' + day.emoji + ' ' + day.name + '</div>' +
                    (isEarned ? '<div class="badge-check">✓</div>' : '<div class="badge-lock">🔒</div>');

                badgesGrid.appendChild(card);
            });
            wrap.appendChild(badgesGrid);

            const giftSection = document.createElement('div');
            giftSection.className = 'gift-section';

            const giftTitle = document.createElement('div');
            giftTitle.className = 'gift-title';
            giftTitle.textContent = '🌺 Self-Care Milestones';
            giftSection.appendChild(giftTitle);

            const giftDesc = document.createElement('div');
            giftDesc.className = 'gift-desc';
            giftDesc.textContent = 'Because caring for yourself is not a luxury — it is a necessity.';
            giftSection.appendChild(giftDesc);

            let nextGift = null;
            let allUnlocked = true;
            for (let i = 0; i < GIFTS.length; i++) {
                if (earnedCount < GIFTS[i].required) {
                    nextGift = GIFTS[i];
                    allUnlocked = false;
                    break;
                }
            }

            if (nextGift) {
                const progressPct = Math.min(100, Math.round((earnedCount / nextGift.required) * 100));

                const outer = document.createElement('div');
                outer.className = 'gift-progress-outer';
                const inner = document.createElement('div');
                inner.className = 'gift-progress-inner';
                inner.style.width = progressPct + '%';
                outer.appendChild(inner);
                giftSection.appendChild(outer);

                const label = document.createElement('div');
                label.className = 'gift-progress-label';
                label.textContent = earnedCount + ' of ' + nextGift.required + ' · ' + nextGift.emoji + ' ' + nextGift.name;
                giftSection.appendChild(label);
            }

            GIFTS.forEach(function(gift) {
                const unlocked = earnedCount >= gift.required;
                const giftBox = document.createElement('div');
                giftBox.className = 'gift-unlock';
                if (!unlocked) {
                    giftBox.style.opacity = '0.5';
                    giftBox.style.filter = 'grayscale(0.5)';
                }
                giftBox.innerHTML =
                    '<div class="gift-emoji">' + (unlocked ? gift.emoji : '🔒') + '</div>' +
                    '<div class="gift-msg">' + (unlocked ? 'Unlocked: ' + gift.name : gift.name) + '</div>' +
                    '<div class="gift-hint">' + (unlocked ? 'You have earned this.' : gift.hint) + '</div>';
                giftSection.appendChild(giftBox);
            });

            if (allUnlocked && earnedCount >= 7) {
                const congrats = document.createElement('div');
                congrats.className = 'gift-unlock';
                congrats.style.marginTop = '14px';
                congrats.innerHTML =
                    '<div class="gift-emoji">🌺</div>' +
                    '<div class="gift-msg">You are tending to yourself</div>' +
                    '<div class="gift-hint">That is the most important work of all. 🌿</div>';
                giftSection.appendChild(congrats);
            }

            wrap.appendChild(giftSection);
            return wrap;
        }

        // ---- INIT ----
        loadFromStorage();

        if (subjectBank.length === 0 && days.length === 7 && days.every(function(d) { return d.length === 0; })) {
            const seed = [
                { name: 'Morning Ritual', category: 'mom', tasks: [
                    { text: 'Warm water with lemon', from: '07:00', to: '07:10' },
                    { text: '10-min stretch', from: '07:10', to: '07:20' },
                    { text: 'Mindful breakfast', from: '07:30', to: '08:00' }
                ]},
                { name: 'Emma (7)', category: 'kid1', tasks: [
                    { text: 'School drop-off', from: '08:15', to: '08:45' },
                    { text: 'Homework check', from: '16:00', to: '16:30' },
                    { text: 'Bedtime story', from: '19:30', to: '19:50' }
                ]},
                { name: 'Leo (5)', category: 'kid2', tasks: [
                    { text: 'Kindergarten drop-off', from: '08:45', to: '09:00' },
                    { text: 'Playtime together', from: '16:30', to: '17:00' },
                    { text: 'Bath & wind-down', from: '18:30', to: '19:00' }
                ]},
                { name: 'Mia (3)', category: 'kid3', tasks: [
                    { text: 'Morning cuddle', from: '07:00', to: '07:15' },
                    { text: 'Nap time', from: '13:00', to: '14:30' },
                    { text: 'Bedtime routine', from: '19:00', to: '19:30' }
                ]},
                { name: 'Movement & Body', category: 'mom', tasks: [
                    { text: 'Walk outside', from: '10:00', to: '10:30' },
                    { text: 'Strength (15 min)', from: '10:30', to: '10:45' }
                ]},
                { name: 'Nourishment', category: 'mom', tasks: [
                    { text: 'Prep a real lunch', from: '12:00', to: '12:30' },
                    { text: 'Afternoon tea & pause', from: '15:00', to: '15:15' }
                ]},
                { name: 'Evening Wind-Down', category: 'mom', tasks: [
                    { text: 'Skincare & quiet', from: '20:30', to: '20:45' },
                    { text: 'Read (10 pages)', from: '20:45', to: '21:15' },
                    { text: 'Lights out', from: '22:00', to: '22:00' }
                ]}
            ];
            seed.forEach(function(s) {
                subjectBank.push({
                    id: genId(),
                    name: s.name,
                    category: s.category,
                    tasks: s.tasks.map(function(t) { return { id: genId(), text: t.text, from: t.from || '', to: t.to || '', links: [], notes: [] }; })
                });
            });

            // Start with Monday: a couple of areas
            days[0] = [
                { id: genId(), bankSubjectId: subjectBank[0].id, tasks: [] },
                { id: genId(), bankSubjectId: subjectBank[1].id, tasks: [] },
                { id: genId(), bankSubjectId: subjectBank[4].id, tasks: [] }
            ];
            days[0].forEach(function(daySubj) {
                const bank = subjectBank.find(function(b) { return b.id === daySubj.bankSubjectId; });
                if (bank) {
                    bank.tasks.forEach(function(t) {
                        daySubj.tasks.push({
                            id: genId(),
                            text: t.text,
                            done: false,
                            from: t.from || '',
                            to: t.to || '',
                            links: [],
                            notes: []
                        });
                    });
                }
            });

            saveToStorage();
        }

        if (days.length !== 7) {
            const fresh = [];
            for (let i = 0; i < 7; i++) fresh.push(Array.isArray(days[i]) ? days[i] : []);
            days = fresh;
        }

        renderNav();
        renderPage();

        window.addEventListener('beforeunload', saveToStorage);

        let welcomed = false;
        document.body.addEventListener('click', function() {
            if (!welcomed) { playTone(440, 0.1, 'sine', 0.05); welcomed = true; }
        }, { once: false });
    })();
    </script>
</body>
